<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Etymology Map</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
</head>
<body>
  <script>
    // Old-format permalink (word.html?word=X[&stop=N]), kept only so links
    // shared or indexed before the move to /words/<slug> still resolve.
    // Every current link on the site points straight at /words/<slug>.
    (function () {
      var params = new URLSearchParams(window.location.search);
      var word = params.get("word");
      var stop = params.get("stop");
      if (!word) {
        window.location.replace("/index.html");
        return;
      }
      var slug = word
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
      var dest = "/words/" + encodeURIComponent(slug);
      if (stop) dest += "?stop=" + encodeURIComponent(stop);
      window.location.replace(dest);
    })();
  </script>
  <p>Redirecting&hellip; <a href="/index.html">Go to Etymology Map</a></p>
</body>
</html>
